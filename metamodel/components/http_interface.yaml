# ============================================
# HTTP接口定义元模型 (HttpInterface)
# 版本: 1.0.0
# 描述: HTTP接口定义，可被微服务集成
# ============================================
components:
  httpInterface:
    type: ComplexField
    description: "HTTP接口定义"

    fields:
      # ---------- 接口ID（自动生成）----------
      - name: id
        type: IdField
        required: true
        generated: true
        template: "HttpInterface.{name}"
        description: "接口ID，自动生成"
        label: "接口ID"
        help: "格式: HttpInterface.{name}，自动生成"

      # ---------- 接口名称（唯一标识）----------
      - name: name
        type: StringField
        required: true
        description: "接口名称，全局唯一"
        pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
        example: "getUserProfile"
        label: "接口名称"
        placeholder: "如 getUserProfile"
        unique: true
        maxLength: 100

      # ---------- 接口描述 ----------
      - name: description
        type: StringField
        required: false
        description: "接口描述"
        maxLength: 500
        example: "获取用户资料接口"
        label: "描述"

      # ---------- HTTP方法 ----------
      - name: method
        type: EnumField
        required: true
        description: "HTTP方法"
        enum:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "PATCH"
        example: "GET"
        label: "方法"
        options:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "PATCH"

      # ---------- 方向 ----------
      - name: direction
        type: EnumField
        required: true
        description: "方向"
        enum:
          - "IN"
          - "OUT"
        example: "IN"
        label: "方向"
        options:
          - "接收"
          - "发送"

      # ---------- URI ----------
      - name: uri
        type: StringField
        required: true
        description: "URI"
        pattern: "^/[/a-zA-Z0-9_{}-]*$"
        example: "/api/v1/users/{userId}"
        label: "URI"
        placeholder: "如 /api/v1/users/{userId}"
        help: "接口路径，支持路径参数"
        maxLength: 500

      # ---------- Schema路径 ----------
      - name: schemaPath
        type: StringField
        required: false
        description: "接口定义Schema路径"
        example: "schemas/user-profile.json"
        label: "Schema路径"
        placeholder: "如 schemas/user-profile.json"
        maxLength: 500

      # ---------- 文档路径 ----------
      - name: docPath
        type: StringField
        required: false
        description: "接口定义文档路径"
        example: "docs/api/get-user-profile.md"
        label: "文档路径"
        placeholder: "如 docs/api/get-user-profile.md"
        maxLength: 500

      # ---------- 使用样例 ----------
      - name: example
        type: StringField
        required: false
        description: "使用样例"
        format: multiline
        example: |
          GET /api/v1/users/123
          Response: {"id": 123, "name": "张三", "email": "zhangsan@example.com"}
        label: "使用样例"
        maxLength: 5000