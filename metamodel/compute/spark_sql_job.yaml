# ============================================
# Spark SQL 计算任务元模型 (SparkSQLJob)
# 版本: 1.0.0
# 描述: Spark SQL任务定义，支持Kafka、StarRocks、HDFS作为输入输出
# ============================================
models:
  - modelType: "SparkSQLJob"
    extends: "ComputeNode"
    version: 1.0.0
    description: "Spark SQL计算任务元模型"

    fields:
      # ---------- 任务ID（自动生成）----------
      - name: id
        type: IdField
        required: true
        generated: true
        template: "SparkSQLJob.{name}"
        label: "任务ID"
        help: "格式: SparkSQLJob.{name}，自动生成"
        buttonName: "把输入字段刷新到sql中"
        script: "scripts/calc_sql.py"

      # ---------- 任务名称（唯一标识）----------
      - name: name
        type: StringField
        required: true
        description: "任务名称，全局唯一"
        pattern: "^[a-zA-Z0-9_-]+$"
        label: "任务名称"
        help: "任务的唯一名称，用于生成ID"
        unique: true

      # ---------- 任务描述 ----------
      - name: description
        type: StringField
        required: false
        maxLength: 500
        label: "描述"

      # ---------- 业务特性 ----------
      - name: features
        type: ArrayField
        required: false
        items:
          type: ReferenceField
          refModelAllowed: [ "Feature" ]
        label: "特性"
        minItems: 0
        maxItems: 20

      # ========== 输入定义 ==========
      - name: inputs
        $ref: "#/components/inputs"

      # ========== 输出定义 ==========
      - name: outputs
        $ref: "#/components/outputs"

      # ========== 维表定义 ==========
      - name: dimensionTables
        $ref: "#/components/dimensionTables"

      # ========== SQL定义 ==========
      - name: sql
        $ref: "#/components/sql"

      # ========== 资源规格 ==========
      - name: resources
        $ref: "#/components/resources"

      # ========== 调度配置==========
      - name: schedule
        required: false
        label: "调度"
        $ref: "schedule.yaml#/components/schedule"

      # ========== spark自定义参数 ==========
      - name: customParameters
        $ref: "#/components/customParameters"

      # ========== Kafka Producer自定义参数 ==========
      - name: kafkaProducerConf
        required: false
        label: "Kafka Producer全局配置"
        $ref: "kafka_producer.yaml#/components/globalConf"

components:
  inputs:
    type: ArrayField
    required: true
    minItems: 1
    maxItems: 50
    description: "输入数据源列表"
    label: "输入"
    items:
      type: ComplexType
      fields:
        - name: name
          type: StringField
          required: true
          pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
          label: "别名"
          help: "输入别名，用于SQL中引用"
          maxLength: 100

        - name: refId
          type: ReferenceField
          required: true
          label: "数据源ID"
          refModelAllowed: ["IcebergTable", "StarRocksTable", "HDFSRawData" ]
          help: "引用已定义的数据源"

  outputs:
    type: ArrayField
    required: true
    minItems: 1
    maxItems: 20
    description: "输出目标列表"
    label: "输出"
    items:
      type: ComplexType
      fields:
        - name: name
          type: StringField
          required: true
          pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
          label: "别名"
          maxLength: 100
          help: "输出别名，用于SQL中引用"

        - name: refId
          type: ReferenceField
          required: true
          label: "数据源ID"
          refModelAllowed: [ "KafkaTopic", "HDFSRawData", "IcebergTable", "StarRocksTable" ]
          help: "引用已定义的数据源"

        - name: conf
          required: false
          label: "topic producer配置"
          $ref: "kafka_producer.yaml#/components/topicConf"

  sql:
    type: ComplexType
    required: true
    description: "SQL计算逻辑"
    label: "SQL"
    fields:
      - name: content
        type: StringField
        required: true
        format: multiline
        label: "SQL内容"
        help: "完整的SQL逻辑，包括INSERT、CREATE VIEW等"
        maxLength: 50000
        buttonName: "把输入字段刷新到sql中"
        script: "scripts/calc_sql.py"

  dimensionTables:
    type: ArrayField
    required: false
    description: "维表列表（用于Lookup Join）"
    label: "维表"
    minItems: 0
    maxItems: 20
    buttonName: "把输入字段刷新到sql中"
    script: "scripts/calc_sql.py"
    items:
      type: ComplexType
      buttonName: "把输入字段刷新到sql中"
      script: "scripts/calc_sql.py"
      fields:
        - name: name
          type: StringField
          required: true
          pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
          label: "别名"
          maxLength: 100
          help: "维表别名，用于SQL中引用"

        - name: refId
          type: ReferenceField
          required: true
          label: "维表ID"
          refModelAllowed: [ "StarRocksTable" ]
          help: "引用已定义的维表ID"

        - name: lookupOptions
          type: StringField
          required: false
          format: multiline
          label: "查询选项"
          help: "维表查询的缓存等配置"
          maxLength: 2000

        - name: broadcast
          type: BooleanField
          required: false
          default: false
          label: "广播维表"
          help: "是否广播小维表优化性能"

  resources:
    type: ComplexType
    required: true
    description: "资源规格配置"
    label: "资源规格"
    fields:
      - name: executor
        type: ComplexType
        required: true
        label: "Executor配置"
        fields:
          - name: count
            type: IntegerField
            required: true
            minimum: 1
            maximum: 1000
            default: 2
            label: "Executor数量"
            unit: "个"

          - name: cores
            type: IntegerField
            required: true
            minimum: 1
            maximum: 32
            default: 2
            label: "CPU核数"
            unit: "核"

          - name: memoryGB
            type: IntegerField
            required: true
            minimum: 1
            maximum: 64
            default: 4
            label: "内存"
            unit: "GB"

      - name: driver
        type: ComplexType
        required: true
        label: "Driver配置"
        fields:
          - name: cores
            type: IntegerField
            required: false
            minimum: 1
            maximum: 16
            default: 1
            label: "CPU核数"
            unit: "核"

          - name: memoryGB
            type: IntegerField
            required: true
            minimum: 1
            maximum: 32
            default: 2
            label: "内存"
            unit: "GB"

  customParameters:
    type: StringField
    required: false
    format: multiline
    label: "自定义参数"
    help: "一行一个 key=value，支持所有Spark官方参数"
    maxLength: 10000